<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anchor: a live online class that helps everyone stay focused. Interactive prototype.">
<title>Anchor Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Mono:wght@200..800&display=swap">
<style>
/* Layout: a floating side rail beside a breadcrumb page (Anchor's "Today" screens), a full-screen live classroom with Full and Focus views, and a floating facilitator panel for usability tests. Tokens and components follow the Anchor design system. */
:root{
  --surface:#f1f6ff; --surface-wash:#dce8ff; --surface-raised:#ffffff; --surface-sunken:#e1ebfb;
  --line:#cbdaf3; --line-strong:#6b80a8; --ink:#12254a; --ink-muted:#465779;
  --action:#101b3d; --on-action:#ffffff; --brand:#1b64da; --brand-hover:#144fb3; --brand-soft:#e2ecff; --on-brand:#ffffff;
  --brand-deep:#0f3a8f; --on-brand-deep:#ffffff; --highlight:#ffd447; --on-highlight:#221c00;
  --success:#0a6e58; --success-soft:#d9f2ea; --attention:#8a4700; --attention-soft:#fff1bf; --on-attention-soft:#12254a; --attention-on-soft:#8a4700; --danger:#b3261e; --danger-soft:#fde4e1; --on-danger-soft:#12254a; --danger-on-soft:#b3261e; --on-danger:#ffffff;
  --long:#7b5ce6; --long-text:#5a3cc8; --track:#e1ebfb; --bar-soft:#c2dbff; --fill-neutral:#e1ebfb; --chip-line:#cbdaf3; --card-edge:transparent;
  --class-blue:#c2dbff; --class-lilac:#dcd0ff; --class-pink:#ffcce4; --class-peach:#ffd9c2; --class-mint:#bfeedd; --on-class:#12254a; --art-paper:#ffffff; --art-line:rgba(18,37,74,.9);
  --shadow-card:0 2px 4px rgba(27,100,218,0.04),0 10px 28px rgba(27,100,218,0.10);
  --shadow-raised:0 1px 2px rgba(18,37,74,0.08),0 2px 8px rgba(18,37,74,0.06);
  --shadow-overlay:0 4px 12px rgba(18,37,74,0.12),0 16px 40px rgba(18,37,74,0.14);
  --focus-ring:0 0 0 2px #f1f6ff,0 0 0 4px #1b64da;
  --scrim:rgba(18,37,74,0.36);
  --font-display:"Lexend","Trebuchet MS",system-ui,sans-serif;
  --font-text:"Atkinson Hyperlegible Next",Verdana,system-ui,sans-serif;
  --font-mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-full:9999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#0b1530; --surface-wash:#152a5c; --surface-raised:#13203f; --surface-sunken:#070f24;
  --line:#25365e; --line-strong:#7d90ba; --ink:#edf3ff; --ink-muted:#a8b8d8;
  --action:#edf3ff; --on-action:#0b1530; --brand:#7fb0ff; --brand-hover:#a6c8ff; --brand-soft:#1a3266; --on-brand:#0b1530;
  --brand-deep:#2450b8; --on-brand-deep:#ffffff; --highlight:#ffd447; --on-highlight:#221c00;
  --success:#5fd3b3; --success-soft:#0f3a30; --attention:#ffb454; --attention-soft:#ffe59a; --on-attention-soft:#221c00; --attention-on-soft:#6b3d00; --danger:#ff9a8f; --danger-soft:#ffd9d4; --on-danger-soft:#2a0d0a; --danger-on-soft:#a3221a; --on-danger:#0b1530;
  --long:#a18bff; --long-text:#c3b5ff; --track:#56709f; --bar-soft:#56709f; --fill-neutral:#24386a; --chip-line:#7d90ba; --card-edge:#25365e;
  --class-blue:#24448f; --class-lilac:#46378f; --class-pink:#7a2a57; --class-peach:#6b3518; --class-mint:#134a3d; --on-class:#edf3ff; --art-paper:rgba(255,255,255,.16); --art-line:#edf3ff;
  --shadow-card:0 2px 4px rgba(0,0,0,0.3),0 10px 28px rgba(0,0,0,0.35);
  --shadow-raised:0 1px 2px rgba(0,0,0,0.5),0 2px 8px rgba(0,0,0,0.3);
  --shadow-overlay:0 4px 12px rgba(0,0,0,0.5),0 16px 40px rgba(0,0,0,0.5);
  --focus-ring:0 0 0 2px #0b1530,0 0 0 4px #7fb0ff; --scrim:rgba(0,0,0,0.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#0b1530; --surface-wash:#152a5c; --surface-raised:#13203f; --surface-sunken:#070f24;
  --line:#25365e; --line-strong:#7d90ba; --ink:#edf3ff; --ink-muted:#a8b8d8;
  --action:#edf3ff; --on-action:#0b1530; --brand:#7fb0ff; --brand-hover:#a6c8ff; --brand-soft:#1a3266; --on-brand:#0b1530;
  --brand-deep:#2450b8; --on-brand-deep:#ffffff; --highlight:#ffd447; --on-highlight:#221c00;
  --success:#5fd3b3; --success-soft:#0f3a30; --attention:#ffb454; --attention-soft:#ffe59a; --on-attention-soft:#221c00; --attention-on-soft:#6b3d00; --danger:#ff9a8f; --danger-soft:#ffd9d4; --on-danger-soft:#2a0d0a; --danger-on-soft:#a3221a; --on-danger:#0b1530;
  --long:#a18bff; --long-text:#c3b5ff; --track:#56709f; --bar-soft:#56709f; --fill-neutral:#24386a; --chip-line:#7d90ba; --card-edge:#25365e;
  --class-blue:#24448f; --class-lilac:#46378f; --class-pink:#7a2a57; --class-peach:#6b3518; --class-mint:#134a3d; --on-class:#edf3ff; --art-paper:rgba(255,255,255,.16); --art-line:#edf3ff;
  --shadow-card:0 2px 4px rgba(0,0,0,0.3),0 10px 28px rgba(0,0,0,0.35);
  --shadow-raised:0 1px 2px rgba(0,0,0,0.5),0 2px 8px rgba(0,0,0,0.3);
  --shadow-overlay:0 4px 12px rgba(0,0,0,0.5),0 16px 40px rgba(0,0,0,0.5);
  --focus-ring:0 0 0 2px #0b1530,0 0 0 4px #7fb0ff; --scrim:rgba(0,0,0,0.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
/* Always reserve the scrollbar's space, so pages that scroll and pages that don't line up exactly. */
html{overflow-y:scroll;scrollbar-gutter:stable}
body{background:var(--surface);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
:focus-visible{outline:2px solid transparent;outline-offset:2px;box-shadow:var(--focus-ring)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* type */
.t-display{font-family:var(--font-display);font-size:40px;line-height:44px;font-weight:600;letter-spacing:-0.02em;text-wrap:balance}
.t-title{font-family:var(--font-display);font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.01em;text-wrap:balance}
.t-heading,.card-h{font-family:var(--font-display);font-size:20px;line-height:28px;font-weight:600}
.t-sub{font-family:var(--font-display);font-size:16px;line-height:24px;font-weight:600}
.t-figure{font-family:var(--font-display);font-size:32px;line-height:36px;font-weight:600;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.t-body-lg{font-size:18px;line-height:28px}
.t-small{font-size:14px;line-height:20px}
.t-label{font-size:14px;line-height:20px;font-weight:600}
.t-caption,.eyebrow{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.eyebrow{color:var(--ink-muted)}
.t-code{font-family:var(--font-mono);font-size:14px;line-height:20px;font-weight:500;letter-spacing:0.04em}
.muted{color:var(--ink-muted)}
.measure{max-width:68ch}
.num{font-variant-numeric:tabular-nums}

/* buttons (Anchor Button: a flat pill) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:var(--r-full);background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:16px;line-height:24px;white-space:nowrap;cursor:pointer;transition:transform .15s ease-out,opacity .15s ease-out,background-color .15s}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn-secondary{background:var(--brand-soft);color:var(--brand)}
.btn-quiet{background:transparent;color:var(--brand)}
.btn-quiet:hover{background:var(--brand-soft);opacity:1}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-outline{background:var(--surface-raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-outline:hover{box-shadow:inset 0 0 0 1.5px var(--line-strong);opacity:1}
.btn-lg{min-height:52px;padding:0 24px}
.btn-sm{min-height:36px;padding:0 16px;font-size:14px;line-height:20px}
.btn-sm svg{width:16px;height:16px}
.btn-block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:inline-grid;place-items:center;border:0;background:var(--surface-raised);box-shadow:var(--shadow-card);cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.link{color:var(--brand);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.link-plain{color:var(--brand);background:none;border:0;padding:0;cursor:pointer;font-weight:700;font-size:14px}

/* chips, badges */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--chip-line);border-radius:var(--r-full);background:var(--surface-raised);color:var(--ink);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip svg{width:16px;height:16px;flex:none}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 12px;border-radius:var(--r-full);background:var(--fill-neutral);color:var(--ink);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
.badge svg{width:14px;height:14px;flex:none}
.b-neutral{background:var(--fill-neutral);color:var(--ink)}
.b-raised{background:var(--surface-raised);color:var(--ink);box-shadow:var(--shadow-raised)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.b-success{background:var(--success-soft);color:var(--success)}
.b-attention{background:var(--attention-soft);color:var(--attention-on-soft)}
.b-danger{background:var(--danger-soft);color:var(--danger-on-soft)}
.b-live{background:var(--highlight);color:var(--on-highlight)}
.code-chip{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:var(--r-sm);font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.04em;color:var(--on-class)}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--on-class)}
.tint-blue{background:var(--class-blue)} .tint-lilac{background:var(--class-lilac)} .tint-pink{background:var(--class-pink)} .tint-peach{background:var(--class-peach)} .tint-mint{background:var(--class-mint)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ic-tile{display:grid;place-items:center;width:56px;height:56px;border-radius:var(--r-md);color:var(--on-class);flex:none}
.ic-tile svg{width:24px;height:24px}
.ic-circle{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);flex:none}
.ic-circle svg{width:20px;height:20px}

/* cards & notices */
.card{background:var(--surface-raised);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--card-edge),var(--shadow-card);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0;color:var(--ink)}
.card-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
.card-head>.stack{gap:4px;min-width:0}
.card-plain{background:var(--surface);border-radius:var(--r-md);padding:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);background:var(--brand-soft);color:var(--ink)}
.notice>svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--brand)}
.notice b{font-weight:700}
.n-info{background:var(--brand-soft)}
.n-attention{background:var(--attention-soft);color:var(--on-attention-soft)} .n-attention>svg{color:var(--attention-on-soft)}
.n-danger{background:var(--danger-soft);color:var(--on-danger-soft)} .n-danger>svg{color:var(--danger-on-soft)}
.n-success{background:var(--success-soft)} .n-success>svg{color:var(--success)}
.n-quiet{background:var(--surface-sunken);color:var(--ink-muted);font-size:14px;line-height:20px} .n-quiet>svg{color:var(--ink-muted);width:16px;height:16px}
.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:24px;color:var(--ink-muted);display:flex;gap:16px;align-items:center}
.rowlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:64px;padding:8px;margin:0 -8px;border-radius:var(--r-md);border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;width:calc(100% + 16px);transition:background-color .15s}
.rowlink:hover{background:var(--surface)}
.rowlink>svg{width:20px;height:20px;flex:none;color:var(--ink-muted)}
.divider{height:1px;background:var(--line)}
.pick{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);cursor:pointer;min-width:0;transition:border-color .15s,background-color .15s}
.pick:hover{border-color:var(--brand);background:var(--brand-soft)}
.pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.pick>svg{width:24px;height:24px;color:var(--brand)}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lbl{font-size:14px;line-height:20px;font-weight:600}
.input,.textarea{min-height:52px;padding:0 16px;border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--surface-raised);width:100%}
.input::placeholder,.textarea::placeholder{color:var(--ink-muted);opacity:1}
select.input{min-height:44px;padding:0 12px}
.textarea{min-height:104px;padding:12px 16px;resize:vertical;line-height:24px}
.input.code{font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;font-size:18px}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:14px;line-height:20px;color:var(--ink-muted)}
.err{font-size:14px;line-height:20px;font-weight:600;color:var(--danger);display:flex;gap:4px;align-items:flex-start}
.err svg{width:16px;height:16px;flex:none;margin-top:2px}
.switch{position:relative;width:52px;height:32px;border-radius:var(--r-full);border:0;background:var(--surface-sunken);box-shadow:inset 0 0 0 1.5px var(--line-strong);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--line-strong);transition:left .15s}
.switch[aria-checked="true"]{background:var(--brand);box-shadow:none}
.switch[aria-checked="true"]::after{left:24px;background:var(--on-brand)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}
body.dlg-open #fac{transform:translateY(calc(100% + 48px));opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
body.dlg-open .sk-fab,body.dlg-open .sk-bub{opacity:0;pointer-events:none}
.lv-focus+.tstrip{margin-top:12px}
.tstrip{display:flex;gap:8px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.tstrip li{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface-2,#e3edff);font-size:14px;font-weight:600}
.tstrip li.speaking{box-shadow:0 0 0 2px var(--brand)}
.tstrip .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:12px}
.plan-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;font-weight:600;color:inherit;cursor:pointer}
.plan-chip.ok{border-color:transparent;background:var(--success-soft,#dff3e8);color:var(--success-ink,#0d4a33);cursor:default}
.plan-chip svg{width:16px;height:16px}
.page{padding-bottom:96px}
@media (pointer:coarse){.btn-sm,.chip,.add-ci,.plan-chip,.note-chip,.badge-btn,.ci-chip button,.stepper button{min-height:44px}.btn-sm{padding-left:16px;padding-right:16px}.stepper button{min-width:44px}}
@media (max-width:640px){.lv-ctl .l{display:none!important}.lv-ctl{padding:10px 12px;gap:8px}.lv-ctl .r{gap:6px}.lv-ctl .chip,.lv-ctl .btn{font-size:14px;padding:0 12px}}
.flexrow{display:flex;flex-wrap:wrap;align-items:stretch;gap:24px}
.flexrow>*{min-width:0}

/* tabs and two-way switches */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-full);border:0;background:none;font-weight:600;color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-sunken);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.track{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-full);background:var(--surface-sunken);box-shadow:inset 0 0 0 1px var(--card-edge)}
.track button{min-height:36px;padding:0 16px;border:0;border-radius:var(--r-full);background:none;font-weight:600;font-size:14px;line-height:20px;color:var(--ink-muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.track button[aria-selected="true"],.track button[aria-pressed="true"]{background:var(--surface-raised);box-shadow:var(--shadow-raised);color:var(--brand)}
.track.icons button{width:36px;padding:0;justify-content:center}
.track svg{width:18px;height:18px}

/* app shell */
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh;background:linear-gradient(var(--surface-wash),var(--surface) 320px)}
.rail-wrap{flex:0 0 296px;max-width:296px;display:flex;padding:16px 0 16px 16px}
.rail{position:sticky;top:16px;width:100%;height:calc(100vh - 32px);min-height:560px;display:flex;flex-direction:column;gap:24px;padding:20px 16px 16px;border-radius:var(--r-lg);background:var(--surface-raised);box-shadow:0 0 0 1px var(--card-edge),var(--shadow-card);overflow:auto}
.wordmark{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:24px;line-height:32px;color:var(--brand);letter-spacing:-.01em;flex:none}
.wordmark svg{width:28px;height:28px}
.rail .wordmark{margin-left:8px}
.rail-sec{display:flex;flex-direction:column;gap:4px}
.rail-sec>.eyebrow{padding:0 8px 4px}
.ws{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px;border:0;border-radius:var(--r-md);color:var(--on-class);text-align:left;cursor:pointer}
.ws .code-chip{background:var(--surface-raised);color:var(--ink)}
.ws svg{width:20px;height:20px;flex:none}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-md);border:0;background:transparent;color:var(--ink-muted);font-weight:600;cursor:pointer;width:100%;text-align:left;font-size:16px;line-height:24px;transition:background-color .15s,color .15s}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface-sunken);color:var(--ink)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav .count{margin-left:auto;background:var(--highlight);color:var(--on-highlight);border-radius:var(--r-full);font-size:12px;padding:0 8px;line-height:20px;font-weight:700}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:12px;padding:4px 8px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:32px;padding:24px max(32px, env(safe-area-inset-right,0px)) 120px 32px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:var(--ink-muted)}
.crumb b{color:var(--ink);font-weight:600}
.crumb button{background:none;border:0;padding:0;color:var(--ink-muted);cursor:pointer;font-size:14px}
.crumb button:hover{color:var(--brand)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.page-head{min-height:100px}
.page-head>.stack{gap:8px;min-width:0;align-self:flex-start}
.page-head>:not(.stack){align-self:flex-end}

/* agenda (Anchor Agenda) */
.ag-bar{display:flex;gap:4px;height:16px}
.ag-seg{box-sizing:border-box;min-width:12px;flex-basis:0;border:2px solid var(--line-strong);border-radius:var(--r-full);background:var(--surface-raised)}
.ag-seg.done{border-color:var(--brand);background:var(--brand)}
.ag-seg.now{border-color:var(--on-highlight);background:var(--highlight)}
.ag-seg.brk{border-color:var(--success);background:var(--class-mint)}
.ag-seg.over{border-color:var(--attention);background:repeating-linear-gradient(135deg,var(--attention) 0 5px,var(--attention-soft) 5px 10px)}
.ag-lbls{display:flex;gap:4px;margin-top:6px}
.ag-lbls span{min-width:12px;flex-basis:0;font-size:12px;line-height:16px;color:var(--ink-muted);overflow-wrap:normal;word-break:normal;hyphens:none;overflow:hidden;text-overflow:ellipsis}
.ag-lbls span.now{color:var(--ink);font-weight:700}
.ag-list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.ag-row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-md);color:var(--ink)}
.ag-row .st{display:grid;place-items:center;flex:none;width:20px;height:20px}
.ag-row .st svg{width:18px;height:18px}
.ag-row .dot{width:12px;height:12px;border:2px solid var(--line-strong);border-radius:50%}
.ag-row .nm{flex:1;min-width:0;font-weight:600}
.ag-row .mn{font-size:14px;line-height:20px;font-variant-numeric:tabular-nums}
.ag-row.done{color:var(--ink-muted)} .ag-row.done .nm{font-weight:400}
.ag-row.now{background:var(--highlight);color:var(--on-highlight)}
.ag-row.brk{background:var(--class-mint);color:var(--on-class)}

/* bar chart */
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;gap:8px;flex:1;min-width:0}
.vbars .col{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.vbars .v{font-size:12px;line-height:16px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.vbars .b{border-radius:var(--r-sm);background:var(--bar-soft)}
.vbars .b.last{background:var(--brand)}
.vbars .b.over{background:var(--long)}
.vbars .b.zero{background:var(--line);height:4px!important}
.vbars .l{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--ink-muted)}
.vbars .l.last{color:var(--ink);font-weight:700}

/* ring + stat tiles */
.ring-wrap{position:relative;width:132px;height:132px;flex:none;display:grid;place-items:center}
.ring-wrap svg{position:absolute;inset:0}
.ring-t{fill:none;stroke:var(--track);stroke-width:12}
.ring-f{fill:none;stroke:var(--brand);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring-c{display:flex;flex-direction:column;align-items:center;position:relative}
.ring-c b{font-family:var(--font-display);font-size:40px;line-height:44px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--brand-soft);min-width:0}
.stat .si{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface-raised);color:var(--brand);flex:none}
.stat .si svg{width:18px;height:18px}
.stat b{display:block;font-family:var(--font-display);font-size:24px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;line-height:20px;color:var(--ink-muted)}
.stat-big{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r-lg);background:var(--brand-soft);min-width:0}
.stat-big b{font-family:var(--font-display);font-size:32px;line-height:36px;font-weight:600;font-variant-numeric:tabular-nums}

/* stepper */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1 1 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-md);min-width:0}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);font-weight:700;font-size:14px;flex:none}
.step .n svg{width:16px;height:16px}
.step.done .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step.now{background:var(--highlight);color:var(--on-highlight)}
.step.now .n{border-color:var(--on-highlight)}
.step .tx{display:flex;flex-direction:column;min-width:0}
.step .tx b{font-size:14px;line-height:20px;font-weight:700}
.step .tx span{font-size:12px;line-height:16px;opacity:.85}

/* live classroom */
.lv{display:flex;flex-direction:column;gap:16px;min-height:100vh;padding:16px max(24px, env(safe-area-inset-right,0px)) 24px max(24px, env(safe-area-inset-left,0px));background:var(--surface);color:var(--ink)}
.float{background:var(--surface-raised);border-radius:var(--r-lg);box-shadow:0 0 0 1px var(--card-edge),var(--shadow-card)}
.lv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 20px}
.lv-head .l,.lv-head .r{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;min-width:0}
.lv-head .r{gap:8px 12px}
.vdiv{flex:none;width:1px;height:40px;background:var(--line)}
.lv-title{font-family:var(--font-display);font-size:20px;line-height:28px;font-weight:600}
.lv-focus{display:flex;flex-wrap:wrap;align-items:stretch;gap:16px;flex:1;min-height:500px}
.tcol{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.tile{position:relative;flex:1;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--r-lg);text-align:center}
.tile.on{background:var(--brand-deep);color:var(--on-brand-deep)}
.tile.off{background:var(--fill-neutral);color:var(--ink)}
.tile.speaking{box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--brand)}
.tile .tic{position:absolute;top:16px;right:16px;display:block}
.tile .tic svg{width:16px;height:16px;display:block}
.tile.off .tic{color:var(--ink-muted)}
.tile .av{display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface-raised);color:var(--brand);font-size:16px;font-weight:700}
.tile.big .av{width:80px;height:80px;font-size:22px}
.tile .nm{font-size:14px;line-height:20px;font-weight:600}
.tile.big .nm{font-size:16px;line-height:24px}
.tile .ts{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:700}
.tile.off .ts{color:var(--ink-muted)}
.tile .ts svg{width:14px;height:14px}
.stage{flex:6 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:48px;border-radius:var(--r-lg);background:var(--class-lilac);color:var(--on-class);position:relative}
.stage h2{margin-top:24px;max-width:14em;font-family:var(--font-display);font-size:48px;line-height:56px;font-weight:600;letter-spacing:-0.02em;text-wrap:balance}
.stage .lead{max-width:30em;font-size:20px;line-height:30px;text-wrap:balance}
.stage .eyebrow{color:var(--on-class);opacity:.8}
.share{flex:6 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px;padding:20px 24px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--brand);position:relative}
.share .sh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.share .sh-top .grow{min-width:0}
.sh-live{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--brand);color:#fff;font-size:13px;font-weight:700}
.sh-live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.35)}
.sh-slide{width:100%;aspect-ratio:16/9;max-height:56vh;background:#fff;color:#12254a;border-radius:12px;padding:5% 7%;display:flex;flex-direction:column;gap:4%;box-shadow:0 6px 24px rgba(18,37,74,.12);border:1px solid #dbe3f0;overflow:hidden}
.sh-slide .k{font-size:clamp(11px,1vw,14px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#1b64da}
.sh-slide h3{font-family:var(--font-display);font-size:clamp(20px,2.4vw,36px);line-height:1.15;font-weight:600}
.sh-slide ul{display:flex;flex-direction:column;gap:2.5%;padding-left:1.2em;font-size:clamp(14px,1.35vw,20px);line-height:1.4}
.sh-screen{width:100%;aspect-ratio:16/9;max-height:56vh;border-radius:12px;background:#1d2433;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.sh-screen .bar{display:flex;gap:6px;align-items:center;color:#cbd5e1;font-size:12px}.sh-screen .bar i{width:10px;height:10px;border-radius:50%;background:#ff6b6b}.sh-screen .bar i+i{background:#ffd447}.sh-screen .bar i+i+i{background:#3ecf8e}
.sh-screen .canvas{flex:1;border-radius:8px;background:#f1f5fb;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;padding:4%}
.sh-screen .canvas span{border-radius:10px;background:#fff;border:2px solid #c2dbff}
.sh-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-ctl .pg{font-weight:700;min-width:7em;text-align:center}
.sh-back svg{width:20px;height:20px;flex:none}.share .sh-top b{flex:1 1 220px}.sh-back>span{flex:1 1 200px}
@media (max-width:640px){.share{flex:none;width:100%;padding:16px}.sh-slide{aspect-ratio:auto;max-height:none;min-height:220px}}
.sh-back{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--warn-soft,#fff3d1);color:#221c00}
.share-opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:inherit;min-height:64px}
.share-opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft,#e3edff)}
.share-opt .ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft,#e3edff);color:var(--brand)}
.share-opt .ico svg{width:22px;height:22px}
.stage-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:auto;padding-top:24px}
.pill-dark{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-full);background:var(--action);color:var(--on-action);font-weight:700}

/* ---------- Study layer: deliberately NOT Anchor's look, so testers can tell the test apart from the product ---------- */
:root{--st:#477f53;--st-strong:#2f5e3a;--st-soft:#eef6ef;--st-ink:#0f2e1c;--st-line:#bcdcc3;--st-font:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#fac,#svy .sv,.lab-bg{--font-display:var(--st-font);--font-body:var(--st-font)}
#fac,#svy .sv{font-family:var(--st-font)}
#fac{--action:var(--st-soft);--on-action:var(--st-strong);--highlight:#2f5e3a;background:var(--st-soft);color:var(--st-ink);border:2px dashed var(--st);box-shadow:0 12px 40px rgba(47,94,58,.22)}
#fac .prompt{color:var(--st-ink);font-family:var(--st-font)}
#fac .fh::before{content:'Usability test';flex:none;padding:2px 8px;border-radius:6px;background:var(--st);color:#fff;font:700 11px/16px var(--st-font);letter-spacing:.06em;text-transform:uppercase}
#fac .fbtn{background:var(--st);color:#fff;border-radius:10px}
#fac .fbtn.ghost{background:transparent;color:var(--st-strong);box-shadow:inset 0 0 0 1.5px var(--st)}
#svy .sv{background:#f6faf6;color:#0f2e1c;--surface:#ffffff;--surface-raised:#f6faf6;--ink:#0f2e1c;--ink-muted:#3f6b52;--line:#d8ebdc;--line-strong:#8fbf99;--brand:var(--st);--brand-soft:var(--st-soft);--action:var(--st);--on-action:#fff;--on-brand:#fff;border:2px dashed var(--st);border-radius:16px}
#svy .sv::before{content:'Usability test \00b7  from the researcher, not part of Anchor';display:block;margin:-32px -32px 0;padding:10px 32px;background:var(--st);color:#fff;font:700 12px/18px var(--st-font);letter-spacing:.06em;text-transform:uppercase;flex:none}
#svy .sv .btn-primary{background:var(--st);color:#fff;border-radius:10px}
#svy .sv .chip,#svy .sv .scale button{border-radius:10px}
#svy .sv .t-title,#svy .sv .t-heading{font-family:var(--st-font);letter-spacing:-.01em}
@media (max-width:760px){#svy .sv::before{margin:-24px -24px 0;padding:10px 24px}}
body.testing::after{content:'';position:fixed;inset:0;border:5px solid #71AF7D;pointer-events:none;z-index:69}
body.testing::before{content:'Usability test \00b7  you are using the Anchor prototype';position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:69;padding:3px 14px 5px;border-radius:0 0 10px 10px;background:var(--st);color:#fff;font:700 12px/16px var(--st-font);letter-spacing:.04em;white-space:nowrap;pointer-events:none}
:root .lab-bg{background:repeating-linear-gradient(135deg,var(--st-soft) 0 18px,#d8ebdc 18px 36px) top/100% 260px no-repeat,linear-gradient(#d8ebdc,var(--surface) 420px);font-family:var(--st-font)}
:root[data-theme="dark"] .lab-bg.lab-bg{background:linear-gradient(#14261a,var(--surface) 420px)}
.lab-bg .band{background:linear-gradient(135deg,#2f5e3a,#477f53 60%,#71AF7D)!important;border:0}
.lab-bg .card{border:1.5px solid var(--st-line)}
.lab-bg .btn-primary{background:var(--st);color:#fff;border-radius:10px}
.lab-bg .hw-n{background:var(--st)}
.lab-bg .eyebrow{color:var(--st-strong)}.lab-bg .band .eyebrow{color:#fff}
:root[data-theme="dark"] .lab-bg .eyebrow{color:#a8d5b1}
.lab-bg .seg-ctl button[aria-pressed="true"]{color:var(--st)}
:root[data-theme="dark"] .lab-bg .seg-ctl button[aria-pressed="true"]{color:#a8d5b1}
.hw-panel{background:var(--st-soft);color:var(--st-ink);border:2px dashed var(--st);border-radius:14px;font-family:var(--st-font)}
.hw-panel .hw-b{background:var(--st);color:#fff;border-radius:10px}.hw-panel .hw-b.ghost{background:transparent;color:var(--st-strong);box-shadow:inset 0 0 0 1.5px var(--st)}
.hw-chip{display:inline-block;padding:1px 7px;margin-right:6px;border-radius:6px;background:var(--st);color:#fff;font-weight:700;font-size:10px;letter-spacing:.06em}
.hw-q{border:2px dashed var(--st);border-radius:14px;font-family:var(--st-font)}
.hw-scale span{border-radius:8px}.hw-scale span.on{background:var(--st);border-color:var(--st);color:#fff}
.lab-bg .btn-secondary,:root[data-theme="dark"] .lab-bg .btn-secondary{color:#0f2e1c;background:#d8ebdc}
#fac summary{opacity:1!important;color:var(--st-strong)}
#svy .sv-fac{border-top:1px dashed var(--st);padding-top:12px}#svy .sv-fac summary{font-weight:600;color:var(--st-strong)}
.ver-tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;background:#fff;color:#2f5e3a;box-shadow:inset 0 0 0 1.5px #477f53;font:700 12px/16px var(--st-font);letter-spacing:.04em}
.study-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:var(--st);color:#fff;font:700 12px/16px var(--st-font);letter-spacing:.06em;text-transform:uppercase}
/* unselected answers and secondary buttons stay white */
#svy .sv .chip:not([aria-pressed="true"]),#svy .sv .scale button:not([aria-checked="true"]),#svy .sv .btn-sm,#svy .sv .btn-secondary{background:#fff}
#fac .fbtn.fbtn.ghost{background:#fff}
.hw-scale span:not(.on){background:#fff;color:#0f2e1c}
.lab-bg .hw-n,#svy .hw-n{color:#fff}.hw-panel .hw-b.ghost{background:#fff}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

/* onboarding */
.onb{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px max(16px, env(safe-area-inset-right,0px)) 120px max(16px, env(safe-area-inset-left,0px));background:linear-gradient(var(--surface-wash),var(--surface) 420px)}

/* profile */
.prof{padding:0;overflow:hidden;gap:0}

.prof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 24px}

@media (max-width:760px){.prof-body{padding:0 20px 24px}.prof-av{width:88px;height:88px;font-size:30px}}

/* builder, library, boards */
.type-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--on-class);flex:none}
.type-ic svg{width:18px;height:18px}
.type-ic.lg{width:48px;height:48px;border-radius:var(--r-md)}
.type-ic.lg svg{width:24px;height:24px}
.seg-main{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);padding:4px;border-radius:var(--r-sm)}
.seg-main .nm{font-size:16px;line-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-row.sel{box-shadow:0 0 0 2px var(--brand),var(--shadow-card)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.pick.dashed{border-style:dashed;justify-content:center;color:var(--brand)}
.pick[disabled]{opacity:.5;cursor:not-allowed}
.cfg{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);background:var(--surface)}
.qbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-md);background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)}
.optrow{display:flex;align-items:center;gap:8px}
.optrow .input{min-height:44px}
.ans{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-full);border:1.5px solid var(--chip-line);background:var(--surface-raised);font-size:13px;font-weight:700;color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.ans svg{width:14px;height:14px}
.ans[aria-pressed="true"]{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.mat{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:var(--r-md);background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)}
.mat svg{width:18px;height:18px;color:var(--brand);flex:none}
.stage.compact{padding:24px;min-height:300px}
.stage.compact h2{font-size:24px;line-height:32px;margin-top:4px}
.stage.compact .lead{font-size:16px;line-height:24px}
.board{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.board-area{flex:1;min-height:220px;border-radius:var(--r-md);background-color:var(--surface-raised);background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:20px 20px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;position:relative}
.board-area.quad{background-image:linear-gradient(var(--line-strong),var(--line-strong)),linear-gradient(var(--line-strong),var(--line-strong)),radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:2px 100%,100% 2px,20px 20px;background-position:center,center,0 0;background-repeat:no-repeat,no-repeat,repeat}
.sticky{width:132px;min-height:88px;padding:12px;border-radius:6px;font-size:14px;line-height:20px;font-weight:600;color:var(--on-class);box-shadow:var(--shadow-raised);transform:rotate(var(--r,0deg));animation:rise .25s}
.sticky.you{box-shadow:0 0 0 2px var(--brand),var(--shadow-raised)}
.video-ph{display:grid;place-items:center;aspect-ratio:16/9;max-width:520px;width:100%;border-radius:var(--r-md);background:var(--brand-deep);color:#fff}
.video-ph svg{width:56px;height:56px}
.pv{width:min(1180px,100%)}
.pv-body{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.pv-body .stage{flex:3 1 480px;min-height:420px}
.pv-side{flex:1 1 260px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* builder */
.seg-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface-raised);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow-card)}
.seg-row .name{border:1.5px solid transparent;background:transparent;border-radius:var(--r-sm);padding:6px 8px;font-weight:600;min-width:0;width:100%}
.seg-row .name:hover,.seg-row .name:focus{border-color:var(--line-strong);background:var(--surface-raised)}
.stepper{display:flex;align-items:center;gap:4px}

.order{display:flex;flex-direction:column}
.order button{width:28px;height:20px;border:0;background:none;cursor:pointer;color:var(--ink-muted);display:grid;place-items:center}
.order button svg{width:14px;height:14px}
.order button[disabled]{opacity:.3;cursor:default}
.boundary{display:flex;align-items:center;gap:10px;padding:4px 0 4px 44px;flex-wrap:wrap}

.ci-chip{display:inline-flex;align-items:center;gap:8px;background:var(--highlight);color:var(--on-highlight);padding:4px 4px 4px 14px;border-radius:var(--r-full);font-weight:600;font-size:14px}
.ci-chip svg{width:14px;height:14px}
.ci-chip button{border:0;background:rgba(34,28,0,0.12);color:var(--on-highlight);border-radius:var(--r-full);height:28px;padding:0 10px;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center}
.add-ci{border:1.5px dashed var(--line-strong);background:transparent;color:var(--brand);border-radius:var(--r-full);min-height:36px;padding:0 14px;font-weight:700;cursor:pointer;font-size:14px}
.add-ci:hover{background:var(--brand-soft)}
.boundary .add-ci+.add-ci{margin-left:6px}
.tpl-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;margin:0 0 16px;border-radius:var(--r-md);background:var(--surface-raised);box-shadow:var(--shadow-card);color:var(--ink-muted);font-size:15px}
.catch-col{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.catch-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-top:8px}
.dialog .list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dialog .list-row:last-child{border-bottom:0}
.tpl-line b{color:var(--ink)}.tpl-line .btn{margin-left:auto}
.stats-hl{background:var(--highlight);border-radius:var(--r-md);padding:12px;box-shadow:0 0 0 2px var(--attention) inset}
.stats-hl .stat b{font-size:28px}
.stats-hl,.stats-hl *{color:#221c00}
.btn-outline-brand{border:1.5px solid var(--brand)!important;color:var(--brand)!important;background:var(--surface-raised)}

/* launcher, facilitator, tables */
.lab-bg{min-height:100vh;background:linear-gradient(var(--surface-wash),var(--surface) 360px);padding:24px max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px))}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px;width:100%}
.task-pick{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.task-pick input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand);flex:none}
.seg-ctl{display:inline-flex;background:var(--surface-sunken);border-radius:var(--r-full);padding:4px;gap:4px}
.seg-ctl button{min-height:44px;padding:0 18px;border-radius:var(--r-full);border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--ink-muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface-raised);color:var(--brand);box-shadow:var(--shadow-raised)}
#fac{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:min(380px,calc(100% - 32px));background:var(--action);color:var(--on-action);border-radius:var(--r-lg);box-shadow:var(--shadow-overlay);font-size:15px;line-height:22px}
body.testing .main,body.testing .onb,body.testing .lab-bg{padding-bottom:300px}
body.testing .lv{padding-bottom:120px}
#fac.in-live{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#fac .fh{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px}
#fac .fb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
#fac .prompt{font-size:17px;line-height:25px;font-weight:600}
#fac .fbtn{min-height:40px;border-radius:var(--r-full);border:0;padding:0 16px;font-weight:700;cursor:pointer;background:var(--on-action);color:var(--action)}
#fac .fbtn.ghost{background:transparent;color:var(--on-action);box-shadow:inset 0 0 0 1.5px currentColor;opacity:.85}

#fac .seq{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#fac .seq button{min-height:40px;border-radius:10px;border:0;cursor:pointer;font-weight:700;background:color-mix(in srgb, var(--on-action) 14%, transparent);color:var(--on-action)}

#fac textarea{width:100%;min-height:56px;border-radius:12px;border:0;padding:8px 10px;background:color-mix(in srgb, var(--on-action) 10%, transparent);color:var(--on-action);resize:vertical}

.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}

  .tcol{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;gap:8px}

  .step .tx span{display:none}
  .seg-row{grid-template-columns:minmax(0,1fr) auto}

 const quiz=seg.id==='quiz'?`<div class="ps-quiz">${['Screen A','Screen B','Screen C'].map(x=>`<div><i></i>${x}</div>`).join('')}</div>`:'';
 const dia=s.d?OSMO_SVG:'';
 return `<div class="pres-bar"><span class="pb-rec"></span><b>${role==='student'?'Prof. Rivera is presenting':'You are presenting'}</b><span>Think-aloud intro.pdf</span><span class="grow"></span><span class="pb-chip">${ic('doc')} Slide ${n} of 10</span>${role==='instructor'?`<button class="btn-ghost-dk" style="min-height:32px" data-act="room-toggle">${ic('upload')} Share room <span class="room-chip-n">${subsOf(L).filter(x=>x.status!=='done').length}</span></button>`:''}</div>

function layPick(){

}
function layoutHTML(L,role){
 const p=PEOPLE[role], all=[...p.l,...p.r], stage=stageHTML(L,role), i=Math.min(segIdx(L),L.segs.length-1);
 const wide=!L.audio&&!L.share&&(roomOn(L,role)||L.segs[i].id==='lab');
 const tiles=all.map(([n,cam,st])=>vtile(n,cam,st,{hand:n==='Jordan Tate'&&role==='instructor'&&L.hands})).join('');
 const k=L.audio?'hide':vlay();
 if(k==='side')return `<div class="lay lay-side">${stage}<ul class="vcol" aria-label="Cameras">${tiles}</ul></div>`;
 if(k==='gallery')return `<div class="lay-gallery">${wide?stage.replace('class="stage','class="stage wide'):stage}${tiles}</div>`;
 if(k==='hide')return `<div class="lay">${stage}${L.audio?'':`<button class="lay-hidechip" data-act="lay-set" data-arg="speaker">${ic('eyeoff')} ${all.length} videos hidden · show</button>`}</div>`;
 return `<div class="lay lay-speaker"><ul class="vstrip" aria-label="Cameras">${tiles}</ul>${stage}</div>`;
}

function dictate(target,text,done){stopMic();const words=text.split(' ');let k=0;const el=()=>document.getElementById(target);const base=(el()?.value||'').trim();
 micT=setInterval(()=>{const e=el();if(!e){stopMic();return}k++;const v=(base?base+' ':'')+words.slice(0,k).join(' ');e.value=v;done(v,false);if(k>=words.length){stopMic();done(v,true)}},170)}

const bdgOf=r=>BADGES.filter(b=>b.role===(r==='instructor'?'i':'s'));
const bdgGet=id=>BADGES.find(b=>b.id===id);
function bdgState(){if(!S.bdg)S.bdg={earned:{voyage:'Sep 30',early:'Oct 9',streak:'Oct 21',team:'Oct 14',launch:'Sep 29',time:'Oct 16'},fresh:{}};return S.bdg}
function award(id){const st=bdgState();if(st.earned[id])return;const now=new Date();st.earned[id]='Today';st.fresh[id]=1;setTimeout(()=>{S.bdgShow=id;renderLayer()},450)}
function confettiHTML(){const c=['#ffd447','#1b64da','#ff8fb8','#8fdcbf','#bba8ff','#ffb98a'];let h='';for(let k=0;k<34;k++){h+=`<i style="left:${(k*29)%100}%;background:${c[k%c.length]};animation-delay:${(k%9)*0.09}s;transform:rotate(${k*37}deg)"></i>`}return `<div class="confetti" aria-hidden="true">${h}</div>`}
function badgeOverlay(){const b=bdgGet(S.bdgShow);if(!b)return '';const st=bdgState();const isNew=st.fresh[b.id];
 return `<div class="scrim bdg-scrim" data-act="bdg-close"><div class="bdg-card" role="dialog" aria-labelledby="bdg-t" aria-modal="true">${isNew?confettiHTML():''}<div class="rays" aria-hidden="true"></div>
  <div class="art">${b.svg}</div><span class="eyebrow">${isNew?'New badge':'Badge'}${st.earned[b.id]&&!isNew?' · earned '+esc(st.earned[b.id]):''}</span><h2 id="bdg-t">${esc(b.n)}</h2><p>${esc(b.c)}</p>
  <span class="priv">${ic('lock')} Only you see your badges unless you choose to show them.</span>
  <div class="acts"><button class="btn btn-primary" data-act="bdg-close">${isNew?'Nice!':'Close'}</button>${S.route!=='s-me'&&S.route!=='i-me'?`<button class="btn" data-act="bdg-all">${ic('star')} See all badges</button>`:''}</div></div></div>`}
function badgesSection(role){const st=bdgState(),list=bdgOf(role),got=list.filter(b=>st.earned[b.id]).length,show=role==='instructor'?S.bdgPubI:S.bdgPubS;
 return `<section class="card bdg-sec" id="badges" aria-label="Badges">${head('Badges',got+' of '+list.length+' earned',`<span class="badge b-raised">${ic('lock')} Private to you</span>`)}
  <div class="bdg-sum"><div class="bdg-meter" role="img" aria-label="${got} of ${list.length} badges earned"><span style="width:${got/list.length*100}%"></span></div><span class="t-small muted">${role==='instructor'?'Earned for how you plan and run sessions':'Earned by taking part'}</span></div>
  <div class="bdg-grid">${list.map(b=>{const e=st.earned[b.id];return `<button class="bdg-tile ${e?'':'locked'} ${st.fresh[b.id]?'fresh':''}" data-act="bdg-view" data-arg="${b.id}" aria-label="${esc(b.n)}${e?', earned':', not earned yet'}"><span class="art">${b.svg}</span><b>${esc(b.n)}</b>${e?`<span class="when">${st.fresh[b.id]?'<span class="bdg-new">NEW</span>':'Earned '+esc(e)}</span>`:`<span>${esc(b.p||'Not yet')}</span>`}</button>`}).join('')}</div>
  <div class="set-row"><div class="grow stack"><span class="t-label">Show my badges on my profile</span><span class="t-small muted">${role==='instructor'?'Students in your classes could see them.':'Classmates could see them. Prof. Rivera never sees them unless you turn this on.'}</span></div><button class="switch" role="switch" aria-checked="${!!show}" aria-label="Show my badges on my profile" data-act="bdg-pub"></button></div></section>`}

/* ---------- live: shared bits ---------- */
function tile([name,cam,st],big){ if(true)return vtile(name,cam,st,{hand:name==='Jordan Tate'&&S.role==='instructor'&&S.L&&S.L.hands});
  return `<li class="tile ${cam?'on':'off'} ${st==='speak'?'speaking':''} ${big?'big':''}"><span class="tic">${ic(cam?'cam':'camoff')}<span class="vh">${cam?'Camera on':'Camera off'}</span></span><span class="av" aria-hidden="true">${initials(name)}</span><span class="nm">${esc(name)}</span><span class="ts">${st==='speak'?'<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Speaking':st==='mic'?ic('mic')+'Mic on':ic('micoff')+'Muted'}</span></li>`;
}
function tileCols(role){const p=PEOPLE[role];return [`<ul class="tcol" aria-label="Cameras, left">${p.l.map(x=>tile(x,true)).join('')}</ul>`,`<ul class="tcol" aria-label="Cameras, right">${p.r.map(x=>tile(x,false)).join('')}</ul>`]}

const ALT={discussion:['whiteboard','Sticky-note round','Everyone posts one idea on a shared board.'],pair:['discussion','Whole-room discussion','One prompt, answered in chat first, then out loud.'],quiz:['poll','Opening poll','One question; the class total sets the scene.']};
function draftMake(){
  const d=S.draft, g=DRAFT_GOALS[d.goal][1];
  const hands=d.level==='talk'?0.7:d.level==='hands'?1.4:1;
  let parts=g.map(([k,n,w,desc],i)=>{let kk=k,nn=n,dd=desc;if(d.ver%2===1&&ALT[k]&&i>0&&i<g.length-1){[kk,nn,dd]=ALT[k]}return {k:kk,n:nn,desc:dd,w:w*(kk==='lecture'?1/hands:(kk==='pair'||kk==='whiteboard'||kk==='discussion')?hands:1)}});
  if(d.len>=75)parts.splice(Math.ceil(parts.length/2),0,{k:'break',n:'Break',desc:'A short pause for everyone; the agenda shows when it ends.',w:0,fixed:5});
  const flex=d.len-parts.filter(p=>p.fixed).reduce((a,p)=>a+p.fixed,0), W=parts.reduce((a,p)=>a+(p.fixed?0:p.w),0);
  parts.forEach(p=>p.min=p.fixed||Math.max(3,Math.round(p.w/W*flex)));
  const diff=d.len-parts.reduce((a,p)=>a+p.min,0); const big=parts.reduce((b,p,i)=>p.min>parts[b].min?i:b,0); parts[big].min+=diff;
  const out=[];parts.forEach(p=>{if(p.min>20&&p.k!=='break'){const h=Math.ceil(p.min/2);out.push({...p,min:h});out.push({...p,n:p.k==='lecture'?p.n+', part 2':p.n+', round 2',desc:p.k==='lecture'?'Pick up where you left off, after the room has answered.':'A second round with a new prompt, so energy stays up.',min:p.min-h})}else out.push(p)});parts=out;
  parts.forEach(p=>p.ci=d.ci&&p.k==='lecture');
  const why=[`${parts.length} parts, none longer than ${Math.max(...parts.map(p=>p.min))} minutes, so attention has somewhere to come back to.`,
   d.ci?'A check-in after each explanation, so you can see the room before moving on.':'No check-ins, as you asked. You can add them later in the builder.',
   d.level==='talk'?'More time for explaining, since you asked for a talk-heavy session.':d.level==='hands'?'Most of the time goes to students working, as you asked.':'A balance of explaining and doing.',
   'Based on plans other teachers shared and how your class answered before.'];
  d.out={parts,why};
}

function brainReply(q){
  for(const [re,t,ideas] of BRAIN)if(re.test(q))return {t,ideas};
  return {t:`Here are three directions for "${q}". Tell me more about the class and I can narrow them down:`,ideas:[['pair','Small-group task',12,'A short, concrete problem for pairs to solve together.'],['quiz','Quick check',4,'Three questions to see what stuck.'],['discussion','Open prompt',8,'One question for the whole room, answered in chat first.']]};
}
function vIBrain(){
  const b=S.brain, starters=['Warm-up ideas for Thursday','How do I check understanding?','My class is quiet, help','Ideas for a 50-minute lab','How should I wrap up?'];
  const msg=m=>m.who==='you'?`<div class="sc-msg you"><span class="avatar">${initials(S.profile.instructor.full)}</span><div class="bub">${esc(m.t)}</div></div>`
   :`<div class="sc-msg"><span style="flex:none">${skipper('hello',44)}</span><div class="stack grow" style="gap:0"><div class="bub">${esc(m.t)}</div>${m.ideas?`<div class="sc-ideas">${m.ideas.map(([k,n,min,desc],j)=>{const t=libGet(k);const key=m.id+'-'+j;const added=b.added[key];return `<div class="sc-idea"><div class="row" style="gap:10px;align-items:center;min-height:48px"><span class="type-ic tint-${t.tint}">${ic(t.icon)}</span><b class="grow" style="line-height:22px">${esc(n)}</b></div><span class="t-small muted">${esc(desc)}</span><span class="t-small num" style="margin-top:auto;font-weight:700;display:flex;gap:6px;align-items:center">${ic('clock','width="14" height="14"')} ${min} min</span><button class="btn btn-sm ${added?'':'btn-primary'}" data-act="brain-add" data-arg="${key}" ${added?'disabled':''}>${added?ic('check')+' Added to Thursday':ic('plus')+' Add to Thursday'}</button></div>`}).join('')}</div>`:''}</div></div>`;
  return shell('instructor','i-brain',`
   <div class="page-head"><div class="stack">${eb('With Skipper')}<h1 class="t-display">Brainstorm</h1><p class="muted">Ask for activity ideas. Add any of them to Thursday's plan, then fit the time in the builder.</p></div><button class="btn" data-act="go" data-arg="i-builder">${ic('layout')} Open planner</button></div>
   <section class="card" style="gap:20px" aria-label="Conversation with Skipper">
    <div class="sc-chat" aria-live="polite">${b.msgs.map(msg).join('')}</div>
    <div class="chips">${starters.map(t=>`<button class="chip" data-act="brain-ask" data-arg="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <form class="row" style="gap:10px" data-form="brain"><input class="input grow" id="brain-in" placeholder="Ask Skipper for ideas, e.g. a group activity for 15 minutes" autocomplete="off"><button class="btn btn-primary" type="submit">${ic('send')} Ask</button></form>
    <p class="t-small muted">${ic('lock','width="14" height="14"')} Skipper's ideas are suggestions. Nothing changes in your plan until you add it.</p>
   </section>`);
}

let simT=null;
function ensureTick(){if(simT)return;simT=setInterval(tick,1000)}

function rvKeep(x){if(!x)return;x.fb=x.fb||{pins:[],chips:[],text:''};const t=document.getElementById('rv-text');if(t)x.fb.text=t.value;document.querySelectorAll('[data-pin]').forEach(el=>{const p=x.fb.pins[+el.dataset.pin];if(p)p.t=el.value})}

document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='pin-in'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();A['pin-post']()}if(e.key==='Escape'&&S.layMenu){S.layMenu=false;render()}});

function stuRoomTick(L){const i=Math.min(segIdx(L),L.segs.length-1);const subs=subsOf(L);const m=subs.find(x=>x.mine);
 if(L.segs[i].id==='share'&&!(m&&m.status==='reviewing')){let c=curSub(L);
  if(!c){c=subs.find(x=>!x.mine&&x.status==='waiting'&&x.pub);if(c){L.rv=c.id;c.status='reviewing';c.fb={pins:[],chips:[],text:''};c.rvT=0;render()}}
  else if(!c.mine){c.rvT=(c.rvT||0)+1;if(c.rvT===3){c.fb.pins.push({x:58,y:46,t:''});render()}if(c.rvT===7){c.fb.pins.push({x:36,y:78,t:''});render()}if(c.rvT>=14){c.status='done';L.rv=null;render()}}}
 if(!m||m.status==='done')return;
 if(m.status==='waiting'){m.eta--;if(m.eta<=0){const p=curSub(L);if(p&&p.status==='reviewing')p.status='done';L.rv=m.id;m.status='reviewing';m.fb={pins:[],chips:[],text:''};m.rvT=0;render();toast('Prof. Rivera opened your work.')}}
 else if(m.status==='reviewing'){m.rvT=(m.rvT||0)+1;
  if(m.rvT===4){m.fb.pins.push({x:62,y:44,t:'This is the moment to quote. Put the participant\'s words first.'});render()}
  if(m.rvT===8){m.fb.pins.push({x:30,y:72,t:'Say how many of the five had this problem.'});m.fb.chips=['Add a quote','Name the severity'];render()}
  if(m.rvT===12){m.fb.text='Good catch. Rank this one first and add the count, then it is ready for the report.';m.status='done';L.rv=null;render();toast('Feedback from Prof. Rivera is in.')}}
}
function tick(){
  const L=S.L; if(!L)return;
  const live=S.route==='s-live'||S.route==='i-live';
  if(!live)return;
  // pulse sim for activity
  if(S.route==='i-live'&&L.boardOn&&S.board.notes.length<16&&Math.random()<.4){const pool=['Pay button hidden below the fold','Didn\'t trust the price','Zone names unclear','Too many taps to start','Liked the progress steps','Plate field rejects spaces','Unsure if permit saved','Map too small on phone','Error message vague'];S.board.notes.push({t:pool[S.board.notes.length%pool.length]});const ba=document.getElementById('board-area');if(ba)ba.innerHTML=notesHTML()}
  if(S.route==='i-live'&&L.activity&&!L.activity.closed&&L.activity.answered<L.activity.target){const a=L.activity;const n=Math.min(a.target-a.answered,1+Math.floor(Math.random()*3));for(let k=0;k<n;k++){const r=Math.random();let acc=0,pick=0;for(let j=0;j<a.w.length;j++){acc+=a.w[j];if(r<acc){pick=j;break}}a.counts[pick]++;a.answered++}const el=document.getElementById('pulse');if(el)el.innerHTML=pulseInner(L)}
  if(S.route==='s-live'){
    stuRoomTick(L);
    if(L.game){const g=L.game;if(g.from==null)g.from=segIdx(L);g.t++;if(!g.notif&&(g.score>=(g.need||8)||g.t>=40))gameNotif(L)}
    if(L.driftIn!=null&&!L.away&&!L.game){L.driftIn--;if(L.driftIn<=0){L.driftIn=null;if(S.onb.quiet.nudge){L.drift={stage:'ask'};renderLayer()}}}
  }
  if(L.reconn){if(L.reconn.state==='down'){L.reconn.gone++;L.elapsed++;if(L.reconn.gone>=8){L.reconn.state='up';renderLayer()}else updTicks()}return}
  if(L.late&&!L.lateJoined)return;
  if(L.checkin){const c=L.checkin;if(c.done&&!c.closed){c.seen=Math.min(c.answered,(c.seen||0)+3+Math.floor(Math.random()*3));if(c.seen>=c.answered)c.closed=true;if(S.route==='s-live')renderLayer()}return}
  if(L.brk){L.brk.left--;if(L.brk.left<=0){L.brk=null;render();if(S.route==='i-live')toast('Break over. Class resumes.')}else updTicks();return}
  const before=segIdx(L);
  if(before>=L.segs.length)return;
  L.elapsed++;
  const after=segIdx(L);
  if(after!==before)onBoundary(before);else{const soon=segLeft(L)<=60;if(S.route==='s-live'&&soon!==!!L.soonShown){L.soonShown=soon;render()}else updTicks()}
}
function onBoundary(i){
  const L=S.L, seg=L.segs[i];
  const ci = S.route==='s-live' ? L.ciAfter[seg.id] : null;
  if(ci&&!L.late){L.checkin={...ci,after:seg.name,pick:null,done:null,counts:[12,7,2],answered:21}}
  if(S.route==='i-live'&&seg.id==='mini'){L.lastCi={q:CI_DEFAULT.q,opts:CI_DEFAULT.opts,counts:[0,0,0],answered:0};L.activity={kind:'Check-in',q:CI_DEFAULT.q,opts:CI_DEFAULT.opts,counts:[0,0,0],answered:0,target:21,w:[.55,.33,.12]}}
  render();
}
function updTicks(){
  const L=S.L;
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;
    if(k==='left')el.textContent=mmss(segLeft(L));
    else if(k==='clock')el.textContent=clockAt(L.elapsed);
    else if(k==='prog'){const i=segIdx(L);if(i<L.segs.length)el.style.width=Math.min(100,(L.elapsed-cumStart(L,i))/L.segs[i].dur*100)+'%'}
    else if(k==='brk'&&L.brk)el.textContent=mmss(L.brk.left);
    else if(k==='brk-back'&&L.brk)el.textContent=clockAt(L.elapsed+L.brk.left);
    else if(k==='cap'){const t=capLine(L);if(el.textContent!==t){el.textContent=t;el.style.animation='none';void el.offsetWidth;el.style.animation=''}}
    else if(k==='elapsed')el.textContent=mmss(L.elapsed);
    else if(k==='cls-left')el.textContent=clsLeft(L);
  });
}

document.addEventListener('click',e=>{
  const facEl=e.target.closest('#fac');
  if(!facEl&&H.cur&&H.cur.state==='running'&&S.route!=='launcher'&&S.route!=='results'){
    H.cur.clicks++;
    if(!H.collapsed&&!H.pinned&&Date.now()-H.cur.t0>2000&&!e.target.closest('#svy')){H.collapsed=true;setTimeout(renderFac,0)}
    if(!e.target.closest('button,a,input,select,textarea,label,[data-act],[role=switch],[role=radio]'))H.cur.misclicks++;
  }
  const t=e.target.closest('[data-act]'); if(!t)return;
  if(t.tagName==='DIV'&&t.classList.contains('scrim')&&e.target!==t)return;
  const fn=A[t.dataset.act]||HA[t.dataset.act]; if(!fn)return;
  if(t.tagName!=='INPUT'&&!(t.tagName==='A'&&t.target==='_blank'))e.preventDefault();
  fn(t.dataset.arg);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='join'){const v=document.getElementById('code').value.trim().toUpperCase().replace(/\s/g,'');S.onb.code=v;
    const norm=v.replace(/[^A-Z0-9]/g,'');
    if(!v)S.onb.codeErr='Enter the class code from your invite.';
    else if(norm==='UXD6Q2'){S.onb.codeErr='';go('s-agree');toast('Found it: UXDG 380 with Prof. Rivera.');return}
    else S.onb.codeErr=`We couldn't find a class with ${esc(v)}. Check the code in your invite email; it looks like ABC-1D2.`;
    if(H.cur)H.cur.errors=(H.cur.errors||0)+1;
    render();document.getElementById('code')?.focus();}
  if(f==='opening'){const v=document.getElementById('opening').value.trim();if(!v)return;S.L.opening=v;S.L.openingSent=true;S.L.chat.push({who:'You',t:v});render()}
  if(f==='chat'){const v=document.getElementById('chatin').value.trim();if(!v)return;S.L.chat.push({who:'You',t:v});render();document.getElementById('chatin')?.focus()}
  if(f==='addemail'){const v=document.getElementById('newemail').value.trim();const r=S.route.startsWith('s-')?'student':'instructor';

const GFORM={base:'https://docs.google.com/forms/d/e/1FAIpQLSf3muYv2tvSiUKRb1JrK9XvZzmuMs4a_zIUYESrHctXFEa0EA/viewform',summary:'entry.2120195939',tasks:'entry.34381518',sus:'entry.739773012'};
const clip=(t,n)=>{t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t};
function formFields(r){
  const sum=[`Prototype version: ${r.version||PROTO_VER}`,`Participant: ${r.participant}`,`Role: ${r.path}`,`Mode: ${r.mode==='free'?'free explore':'scripted tasks'}`,`Started: ${r.startedAt}`,`Ended: ${r.endedAt||''}`,`Screen: ${r.device?r.device.w+'x'+r.device.h:''}`,`Theme: ${r.theme}`,`Tasks: ${(r.tasks||[]).length}`,`SUS score: ${r.susScore??'not answered'}`,`Run ID: ${r.id}`].join('\n');
  const tasks=(r.tasks||[]).map(t=>{const qs=SURVEY[t.id]||[];
    return [`${t.id} · ${t.title}`,`Outcome: ${t.outcome} · ${t.seconds}s · ${t.clicks} clicks (${t.misclicks} misclicks)`,`Ease: ${t.seq??'-'}/7 · Able to do it: ${t.able||'-'}`]
      .concat(qs.map((q,k)=>`${q[0]} → ${(t.answers||[])[k]||'-'}`))
      .concat(t.comment?[`Comment: ${clip(t.comment,500)}`]:[]).concat(t.note?[`Facilitator note: ${clip(t.note,300)}`]:[]).join('\n')}).join('\n\n')||'No scripted tasks (free explore).';
  const sus=r.sus?SUS_Q.map((q,i)=>`${i+1}. ${q} → ${r.sus[i]}/5`).join('\n')+`\nSUS score: ${r.susScore}/100`+(r.nps!=null?`\nRecommend (NPS question, 0–10): ${r.nps}`:'')+(r.susComment?`\nOne thing to change: ${clip(r.susComment,600)}`:''):'Not answered';
  return [sum,tasks,sus];
}
function formURL(r){const f=formFields(r);let t=f[1];if(t.length>5500)t=t.slice(0,5490)+'…';
  return GFORM.base+'?usp=pp_url&'+GFORM.summary+'='+encodeURIComponent(f[0])+'&'+GFORM.tasks+'='+encodeURIComponent(t)+'&'+GFORM.sus+'='+encodeURIComponent(f[2])}

function startTask(skipIntro){
  const t0=H.tasks[H.i];
  if(!skipIntro){H.cur={id:t0.id,title:t0.title,state:'intro',clicks:0,misclicks:0,path:[]};clearTimeout(H.autoT);renderFac();renderSvy();return}
  const t=t0;
  const keep={review:S.review,plan:S.plan,template:S.template};
  if(!['I3','I4','I9'].includes(t.id))S=Object.assign(fresh(),{role:H.path});
  else {S.dlg=null;}
  if(H.path==='instructor'){S.plan=keep.plan;S.template=keep.template;S.review=keep.review}
  if(t.id==='I1'||t.id==='I7'||t.id==='I8'){S.plan=fresh().plan;S.selSeg=1}
  S.joinedBefore=t.id!=='S1'&&t.id!=='S2';
  t.setup();
  if(S.L)ensureTick();
  H.cur={id:t.id,title:t.title,state:'running',t0:Date.now(),clicks:0,misclicks:0,errors:0,path:[S.route],seq:null,note:'',outcome:null,data:{}};
  H.collapsed=false;H.pinned=false;
  const myT=H.cur;clearTimeout(H.autoT);H.autoT=setTimeout(()=>{if(H.cur===myT&&myT.state==='running'&&!H.pinned&&!H.collapsed){H.collapsed=true;renderFac()}},45000);
  render();window.scrollTo(0,0);
}
function finishTask(outcome,data={}){
  const c=H.cur; if(!c||c.state!=='running')return;
  c.state='rate';c.outcome=outcome;c.ms=Date.now()-c.t0;c.data=data;
  H.collapsed=false;H.hidden=false;
  if(outcome==='success'){c.state='wait';c.wait=15}
  setTimeout(renderFac,outcome==='success'?300:0);
}
function recordTask(){
  const c=H.cur;
  H.run.tasks.push({id:c.id,title:c.title,outcome:c.outcome,seconds:Math.round(c.ms/100)/10,clicks:c.clicks,misclicks:c.misclicks,errors:c.errors||0,seq:c.seq,able:c.sv&&c.sv.able!=null?['Yes, easily','Yes, with some trouble','No'][c.sv.able]:'',answers:c.sv?(SURVEY[c.id]||[]).map((q,k)=>c.sv.q[k]!=null?q[1][c.sv.q[k]]:''):[],comment:c.sv?c.sv.comment||'':'',note:c.note||'',path:c.path.slice(0,60),detail:c.data});
  saveRun();
}

function localRuns(){try{return JSON.parse(localStorage.getItem('anchor-runs')||'[]')}catch(e){return[]}}
function saveLocal(run){try{const all=localRuns().filter(r=>r.id!==run.id);all.push(run);localStorage.setItem('anchor-runs',JSON.stringify(all.slice(-200)))}catch(e){}}
async function saveRun(){
  if(H.run.practice)return;if(H.run.where!=='own'&&!RECORDING)return;H.run.saved=true;
  const run=JSON.parse(JSON.stringify(H.run)); saveLocal(run);
  if(H.db&&H.uid){const put=async()=>{const ref=H.db.doc('runs/'+H.uid);const cur=await ref.get();const runs=(cur&&cur.exists&&cur.data().runs)||{};runs[run.id]=run;await ref.set({runs})};
    try{await put();H.dbState='saved'}catch(e){H.dbState='error';if(e&&e.code==='unavailable')setTimeout(()=>put().catch(()=>{}),1500)}}
  if(S.route==='results')render();
}
async function loadRuns(){
  if(!RECORDING){H.runs=[];H.dbState='off';if(S.route==='results')render();return}
  if(H.db&&H.owner){try{const snap=await H.db.collection('runs').limit(500).get();const all=[];snap.docs.forEach(d=>{const v=d.data();if(v&&v.runs)Object.values(v.runs).forEach(r=>all.push(r));else if(v&&v.tasks)all.push(v)});const ids=new Set(all.map(r=>r.id));localRuns().forEach(r=>{if(!ids.has(r.id))all.push(r)});H.runs=all;H.dbState='ok'}catch(e){H.runs=localRuns();H.dbState='error'}}
  else if(H.db){H.runs=localRuns();H.dbState='tester'}
  else H.runs=localRuns();
  if(S.route==='results')render();
}

function csvRows(runs){
  const head=['run','participant','path','started','task','title','outcome','seconds','clicks','misclicks','errors','ease_1to7','able_to_do','task_q1','task_q2','comment','note','detail','screens','sus_score','sus_answers','sus_comment','nps_0to10'];
  const rows=[head];
  runs.forEach(r=>(r.tasks||[]).forEach(t=>rows.push([r.id,r.participant,r.path,r.startedAt,t.id,t.title,t.outcome,t.seconds,t.clicks,t.misclicks,t.errors,t.seq,t.able||'',(t.answers||[])[0]||'',(t.answers||[])[1]||'',t.comment||'',t.note,JSON.stringify(t.detail||{}),(t.path||[]).join(' > '),r.susScore??'',(r.sus||[]).join(' '),r.susComment||'',r.nps??''])));
  return rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
}

}
